<div class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col font-sans">
  @if (authService.authState().isAuthenticated) {
    <app-navbar [user]="authService.authState().user" (logout)="logout()"></app-navbar>

    <!-- Sub Navigation Bar -->
    <nav class="bg-white dark:bg-slate-900 border-b border-slate-200/80 dark:border-slate-800 px-4 sm:px-8">
      <div class="max-w-7xl mx-auto flex items-center gap-1 sm:gap-6 overflow-x-auto py-2 text-sm font-semibold">
        <a routerLink="/dashboard" routerLinkActive="text-emerald-600 border-emerald-600 bg-emerald-50/50 dark:bg-emerald-950/40" [routerLinkActiveOptions]="{exact: true}" class="px-3 py-2 rounded-xl border border-transparent text-slate-600 dark:text-slate-300 hover:text-emerald-600 transition-colors whitespace-nowrap">
          📊 Dashboard
        </a>
        <a routerLink="/expenses" routerLinkActive="text-emerald-600 border-emerald-600 bg-emerald-50/50 dark:bg-emerald-950/40" class="px-3 py-2 rounded-xl border border-transparent text-slate-600 dark:text-slate-300 hover:text-emerald-600 transition-colors whitespace-nowrap">
          💸 Expenses
        </a>
        <a routerLink="/cashflow" routerLinkActive="text-emerald-600 border-emerald-600 bg-emerald-50/50 dark:bg-emerald-950/40" class="px-3 py-2 rounded-xl border border-transparent text-slate-600 dark:text-slate-300 hover:text-emerald-600 transition-colors whitespace-nowrap">
          💵 Cash Flow
        </a>
        <a routerLink="/savings" routerLinkActive="text-emerald-600 border-emerald-600 bg-emerald-50/50 dark:bg-emerald-950/40" class="px-3 py-2 rounded-xl border border-transparent text-slate-600 dark:text-slate-300 hover:text-emerald-600 transition-colors whitespace-nowrap">
          🎯 Target Savings
        </a>
        <a routerLink="/import-export" routerLinkActive="text-emerald-600 border-emerald-600 bg-emerald-50/50 dark:bg-emerald-950/40" class="px-3 py-2 rounded-xl border border-transparent text-slate-600 dark:text-slate-300 hover:text-emerald-600 transition-colors whitespace-nowrap">
          📁 Import/Export
        </a>
        <a routerLink="/telegram-sync" routerLinkActive="text-emerald-600 border-emerald-600 bg-emerald-50/50 dark:bg-emerald-950/40" class="px-3 py-2 rounded-xl border border-transparent text-slate-600 dark:text-slate-300 hover:text-emerald-600 transition-colors whitespace-nowrap">
          🤖 Telegram Bot
        </a>
      </div>
    </nav>
  }

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <router-outlet></router-outlet>
  </main>
</div>
